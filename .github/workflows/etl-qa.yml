name: Banking ETL QA

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  run-etl-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Verify installed tools
        run: |
          python --version
          java -version
          python -m pytest --version

      - name: Create reports folder
        run: |
          mkdir -p reports

      - name: Run ETL QA tests
        env:
          TEST_ENV: QA1
          QA1_DATABRICKS_SERVER_HOSTNAME: ${{ secrets.QA1_DATABRICKS_SERVER_HOSTNAME }}
          QA1_DATABRICKS_HTTP_PATH: ${{ secrets.QA1_DATABRICKS_HTTP_PATH }}
          QA1_DATABRICKS_TOKEN: ${{ secrets.QA1_DATABRICKS_TOKEN }}

        run: |
          python -m pytest -v \
            --html=reports/test_report.html \
            --self-contained-html

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banking-etl-qa-report
          path: reports/test_report.html
          if-no-files-found: warn