name: Banking ETL QA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-etl-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          TEST_ENV: QA1
          QA1_DATABRICKS_SERVER_HOSTNAME: ${{ secrets.QA1_DATABRICKS_SERVER_HOSTNAME }}
          QA1_DATABRICKS_HTTP_PATH: ${{ secrets.QA1_DATABRICKS_HTTP_PATH }}
          QA1_DATABRICKS_TOKEN: ${{ secrets.QA1_DATABRICKS_TOKEN }}
        run: |
          pytest -v \
            --html=reports/test_report.html \
            --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl-qa-report
          path: reports/test_report.html